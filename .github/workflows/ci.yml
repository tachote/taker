name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # Pinned so a new staticcheck release cannot turn CI red on its own.
      # The tool's module needs a newer Go than go.mod, so let the go
      # command fetch that toolchain for the build only; the analysis then
      # runs under the go.mod toolchain set up above.
      - name: Staticcheck
        run: |
          GOTOOLCHAIN=auto go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          "$(go env GOPATH)/bin/staticcheck" ./...

      # The release ships windows/amd64, so keep it compiling.
      - name: Cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=darwin GOARCH=arm64 go build -o /dev/null .

  # Separate job so a new advisory reads as its own failure, not as a broken
  # build. It scans under the go.mod toolchain, the same one the release
  # workflow builds with, so standard-library advisories match the binaries
  # users download.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Same toolchain handling as staticcheck: newer Go to build the tool,
      # go.mod's Go for the scan.
      - name: Govulncheck
        run: |
          GOTOOLCHAIN=auto go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          "$(go env GOPATH)/bin/govulncheck" ./...
