name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup-go v6 reads go.mod's toolchain line, not only the go line.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The binaries carry this Go's standard library, and scanners judge a
      # release by it: ship only with the toolchain go.mod pins, the one CI
      # tested and govulncheck scanned.
      - name: Check the Go toolchain
        run: |
          want="$(go mod edit -json | jq -r '.Toolchain // empty')"
          have="$(go env GOVERSION)"
          test -z "$want" || test "$want" = "$have" || { echo "go is $have, go.mod pins $want"; exit 1; }

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
